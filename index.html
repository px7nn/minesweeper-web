<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineSweep💣</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="game-flag">
        <div class="game">
            <div class="score">
                <div class="stats-screen">
                    <div class="stats-left">
                        <div class="stats-score"></div>
                        <div class="stats-restart">🙂</div>
                    </div>
                    <div class="leaderboard">
                        <span class="heading">Leaderboard</span>
                        <span class="top">1. px7nn (50s)</span>
                        <span class="top">2. Madmax (321s)</span>
                        <span class="top">3. skull (789s)</span>
                    </div>
                </div>
                <div class="mineCounter">000</div>
                <div class="restart">🙂</div>
                <div class="timer">000</div>
            </div>
            <div class="grid"></div>
        </div>
        <div class="flag">🚩</div> 
    </div>
    <script src="scripts/index.js"></script>
</body>
</html>
